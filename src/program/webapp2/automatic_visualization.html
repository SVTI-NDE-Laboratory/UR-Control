          <div class="visualization-heading">
            <dl class="visualization-summary" aria-label="Wall coordinate summary">
              <dt>Line:</dt><dd id="summary-line">—</dd>
              <dt>Nb. points:</dt><dd id="summary-point-count">—</dd>
            </dl>
            <button id="show-points-list" type="button">Points list</button>
